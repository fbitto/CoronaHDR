[project]
name = "coronahdr"
version = "0.1.0"
description = "Linear radiometric HDR masters from total solar eclipse images"
readme = "README.md"
authors = [ { name = "Francisco Bitto" } ]
license = "MIT"
license-files = ["LICENSE", "docs/third-party/*.txt", "src/coronahdr/_ael_filters/LICENSE"]
requires-python = "==3.14.8"
dependencies = [
    "astropy>=8.0.2",
    "numpy>=2.5.4",
    "opencv-python-headless>=5,<6",
    "pyside6-essentials>=6.12,<7",
    "rawpy>=0.27.1",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "tifffile>=2026.10.15",
]

[project.scripts]
coronahdr = "coronahdr:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
